# ── Reproducibility ──────────────────────────────────────────
seed: 168

# ── Dataset ──────────────────────────────────────────────────
n_per_domain: 250          # 250 per domain = 1000 main dataset
                           # 95% CI half-width ~= +/-6% on FEA per domain (p=0.5 worst case)
n_calibration_per_domain: 5  # disjoint from main set; used ONLY to calibrate
                              # threshold_tau, never scored in results tables
n_gradient: 100            # 20 per content type = 100 gradient subset
domains:
  - financial
  - medical
  - legal
  - technical

# ── Encoding ─────────────────────────────────────────────────
threshold_tau: -8.0        # logprob threshold for VS injection stopping.
                           # Calibrated on the disjoint calibration split
                           # (20 docs, 807 chars) against the real proxy
                           # model: -20.0 (original) was NEVER reached by
                           # any character (807/807 exhausted the full
                           # 28-byte payload) — too strict for this
                           # model/payload. -8.0 gives median=6, p25=4
                           # iterations (closest fit to the plan's own
                           # "3-5 iterations typical" target) with only
                           # a 2.85% tail maxing out. Re-run
                           # `python src/encode.py --calibrate` if the
                           # disruption_payload (salt) changes.
disruption_payload: "ghost_obfuscation_payload_v1"
                           # NOT injected literally anymore. It's a salt
                           # mixed (with `seed` above, plus doc id / field
                           # name / char index) into a keyed SHA-256 stream
                           # (unicode_utils.derive_payload_bytes) that gives
                           # EVERY character occurrence its own pseudorandom
                           # payload. A single literal payload reused
                           # everywhere would leave a fixed byte-sequence
                           # signature repeated across the whole corpus --
                           # strippable by pattern-matching alone, without
                           # even needing to know it's VS ranges (strictly
                           # weaker than the strip_vs ablation this paper
                           # already evaluates). Same (seed, salt, context)
                           # always reproduces the same bytes, so reruns and
                           # checkpointing stay reproducible.

bidi_permute_search_trials: 500   # random search width for the separable-
                                   # permutation search in bidi_permute.py.
                                   # Every field length tested (2-12 digits)
                                   # reached a full derangement (max possible
                                   # Hamming distance) well within this
                                   # budget -- see src/bidi_permute.py
                                   # --selftest. The search's own RNG seed is
                                   # derived per (doc id, field name) from
                                   # `seed`+`disruption_payload` above, NOT
                                   # shared globally -- the search itself
                                   # only looks at field LENGTH, never at
                                   # the actual characters, so a shared seed
                                   # would give every same-length field
                                   # across the whole corpus the identical
                                   # stored permutation: directly invertible
                                   # from a handful of examples.

encoding_conditions:
  - clean
  - bae
  - textfooler
  - homochar
  - vs_only
  - bidi_only
  - bidi_permute
  - bidi_permute_sentence   # Mechanism 2 applied to the SENTENCE containing
                            # each field, not just the field span -- see
                            # sentence-level obfuscation plan. Never
                            # collapsed with bidi_permute (separate
                            # measured condition, same convention as
                            # NFKC != strip_both above).
  - ghost
  - ghost_nfkc
  - ghost_permute
  - ghost_permute_nfkc

# ── Models ───────────────────────────────────────────────────
proxy_model: "Qwen/Qwen2.5-7B-Instruct"

local_models:
  llama32_3b:
    hf_id: "meta-llama/Llama-3.2-3B-Instruct"
    max_new_tokens: 50
    dtype: "bfloat16"
  llama31_8b:
    hf_id: "meta-llama/Llama-3.1-8B-Instruct"
    max_new_tokens: 50
    dtype: "bfloat16"
  qwen25_3b:
    hf_id: "Qwen/Qwen2.5-3B-Instruct"
    max_new_tokens: 50
    dtype: "bfloat16"
  qwen25_7b:
    hf_id: "Qwen/Qwen2.5-7B-Instruct"
    max_new_tokens: 50
    dtype: "bfloat16"
    is_proxy: true         # dual role: proxy + target
  deepseek_r1_14b:
    hf_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
    max_new_tokens: 2048   # reasoning model needs more tokens
    dtype: "bfloat16"
    strip_think_tags: true # strip <think>...</think> before eval
  mistral7b:
    hf_id: "mistralai/Mistral-7B-Instruct-v0.3"
    max_new_tokens: 50
    dtype: "bfloat16"
  deepseek_llm_7b:
    hf_id: "deepseek-ai/deepseek-llm-7b-chat"
    max_new_tokens: 50
    dtype: "bfloat16"      # only genuinely DeepSeek-native tokenizer we have;
                           # deepseek_r1_14b is a Qwen-tokenizer distill
# NOTE: deepseek_r1_32b is NOT listed here in local_models -- it is only
# ever used as an agent_backbones entry below (its own self-contained
# hf_id/dtype/quantization spec there), never as a search-tier ensemble
# member, so it doesn't belong in this adversary-side model registry.

# ── Agent backbone (GHOST-Agent's agent role, distinct from the models
# above, which are all ADVERSARY-side: proxy/target/ensemble/verify) ────
# GHOST_AGENT_TASKS.md's CRITICAL RULE 5 originally fixed the agent
# model to claude-sonnet-4-6. This section makes that a config-driven
# ablation axis instead (src/agent_backbone.py) -- e.g. to compare
# Claude Sonnet vs. a free-to-run local reasoning model as the thing
# that PROPOSES encodings, holding the adversary ensemble/verify tiers
# fixed. `provider: anthropic` entries reuse api_models-style fields
# (model_id); `provider: local` entries reuse local_models-style fields
# (hf_id/dtype/max_new_tokens/strip_think_tags) but are kept as their
# own entries below rather than pointed at agent_ensemble.members,
# because deepseek_r1_14b is ALSO a search-tier ensemble member above --
# using the identical loaded weights as both proposer and one of the
# panel voting on it would be circular (same risk already called out for
# excluding qwen25_7b from agent_ensemble.members, since it's the
# encoding-time proxy). If deepseek_r1_14b is ever used as agent_backbone
# for a real ablation run, exclude it from agent_ensemble.members for
# that run, or treat any "defended" verdict from it with the same
# skepticism as a proxy grading its own homework.
agent_backbones:
  default: claude_sonnet
  options:
    claude_sonnet:
      provider: "anthropic"
      model_id: "claude-sonnet-4-6"
    claude_haiku:
      provider: "anthropic"
      model_id: "claude-haiku-4-5"
    claude_opus:
      provider: "anthropic"
      model_id: "claude-opus-4-6"
    deepseek_r1_14b:
      provider: "local"
      hf_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B"
      max_new_tokens: 4000
      dtype: "bfloat16"
      strip_think_tags: true  # see caveat above: also an ensemble member --
                               # exclude from agent_ensemble.members when
                               # using this as the backbone
    deepseek_r1_32b:
      provider: "local"
      hf_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-32B"
      max_new_tokens: 4000
      dtype: "bfloat16"       # base dtype before quantization is applied
      quantization: "8bit"    # bitsandbytes load_in_8bit -- ~32-34GB VRAM
                              # instead of ~64-66GB at plain bf16. Adopted
                              # after TWO real failures at bf16 on this
                              # node: (1) OOM when the resident backbone
                              # collided with an ensemble member's own GPU
                              # residency mid-run, and (2) even before
                              # that, from_pretrained's checkpoint-shard
                              # staging in host RAM exceeded a 60GB SLURM
                              # --mem allocation and got SIGKILLed (exit
                              # 137) before any GPU work started. 8-bit
                              # fixes both at once. Introduces quantization
                              # noise as an uncharacterised variable in
                              # the encoding-search results -- not yet
                              # measured against an unquantized run.
      strip_think_tags: true  # NOT an ensemble member -- no self-grading risk

api_models:
  gpt55:
    provider: "openai"
    model_id: "gpt-5.5"
    max_tokens: 50
    temperature: 0
  gpt56_sol:
    provider: "openai"
    model_id: "gpt-5.6-sol"
    max_tokens: 2000       # reasoning model -- 50 silently burned the whole
                           # budget on hidden reasoning tokens (finish_reason
                           # "length", reasoning_tokens=50, zero visible
                           # output), which check_extraction then read as a
                           # failed extraction / defended verdict. That was
                           # a false negative, not a real defense: with 2000
                           # tokens the SAME encoded input was extracted
                           # correctly. Same failure mode as deepseek_r1_14b
                           # above, just never given the analogous bump.
    temperature: 0         # rejected outright by this model at query time;
                           # src/adversary.py's _call_openai retries without
                           # it -- see CLAUDE.md gotcha on gpt56_sol determinism
  claude_sonnet:
    provider: "anthropic"
    model_id: "claude-sonnet-4-6"
    max_tokens: 50
    temperature: 0
  claude_haiku:
    provider: "anthropic"
    model_id: "claude-haiku-4-5"
    max_tokens: 50
    temperature: 0
                           # NOT added to agent_ensemble.frontier_verify_models --
                           # that production list stays untouched; this entry
                           # exists so a one-off verify-tier script can query
                           # claude_haiku directly (agent_backbones.options.
                           # claude_haiku is a SEPARATE section, used only for
                           # the agent backbone role, not the adversary role --
                           # both entries can point at the same real model
                           # since one script CAN use Haiku as both, see that
                           # script's own circularity caveat).
  claude_opus:
    provider: "anthropic"
    model_id: "claude-opus-4-6"
    max_tokens: 50
    temperature: 0
  gemini_31_pro:
    provider: "google"
    model_id: "gemini-3.1-pro-preview"
    max_tokens: 2000       # reasoning model -- 50 silently burned the whole
                           # budget on hidden thinking tokens (finish_reason
                           # MAX_TOKENS, thoughts_token_count=47, zero visible
                           # output/None text), which check_extraction would
                           # read as a failed extraction / defended verdict.
                           # That's a false negative, not a real defense: with
                           # 2000 tokens the same prompt returned real text.
                           # Same failure mode as gpt56_sol / deepseek_r1_14b
                           # above, confirmed via a real smoke test, not the
                           # SDK-migration bug this was originally suspected
                           # to be.
    temperature: 0

# ── GHOST-Agent adversary tiers (GHOST_AGENT_TASKS.md) ─────────
# Two separate roles, never conflated:
#   search-tier  — cheap local ensemble, used INSIDE the agent's
#                  generate/feedback/reflect/improve loop. This is a
#                  proxy for cost reasons only, same status as the Qwen
#                  logprob proxy above -- its "success" is never the
#                  paper's reported number.
#   verify-tier  — real frontier models, queried only on the converged
#                  encoding (frontier_verify_every_n_iterations: 0), plus
#                  a held-out calibration sample used to measure the
#                  search/verify gap. THIS is what gets reported.
agent_ensemble:
  consensus_threshold: 3    # of N valid (floor-check-passed) members must
                             # FAIL extraction to declare the encoding
                             # defended at search time
  clean_floor_check: true   # query each member on unencoded clean text
                             # first; exclude its vote if it can't even
                             # extract from that (weak instruction-following
                             # != working defense)
  members:                  # keys into local_models above. Chosen for
                             # 4 distinct tokenizer families -- deliberately
                             # excludes qwen25_7b/qwen25_3b since
                             # deepseek_r1_14b already covers the Qwen
                             # tokenizer family and qwen25_7b is the
                             # encoding-time proxy (would be circular).
    - llama31_8b
    - mistral7b
    - deepseek_r1_14b       # reasoning-style member; strip_think_tags
                             # applied unconditionally in adversary.py,
                             # not gated on this flag
    - deepseek_llm_7b
  frontier_verify_models:   # keys into api_models above
    - claude_sonnet
    - gpt56_sol
    - gemini_31_pro
  frontier_verify_every_n_iterations: 0  # 0 = only verify the final
                             # converged encoding, never mid-search
                             # (cost control -- see project memory on
                             # search/verify gap reporting)
                             # NOTE: a SEPARATE mechanism now exists for
                             # deliberately consulting a frontier model
                             # DURING search -- src/ensemble.py's
                             # run_ensemble_query(frontier_check_fn=...),
                             # driven by src/calibrate_agent_search.py.
                             # It must ONLY ever be run against the
                             # disjoint data/raw/calibration.json split,
                             # never here against real eval/Track A
                             # fields -- doing so would optimise the
                             # search directly against whichever frontier
                             # model is checked, invalidating that
                             # model's later transferability number.

# ── In-context defense ────────────────────────────────────────
inctx_models:
  - gpt56_sol
  - claude_opus
inctx_shots: [5, 10, 20]
inctx_n_docs: 20           # evaluate on first 20 financial docs

# ── Gradient subset ───────────────────────────────────────────
gradient_types:
  - random_digits
  - formatted_identifiers
  - alphanumeric_codes
  - rare_proper_nouns
  - natural_language
gradient_n_per_type: 20

# ── API rate limiting ─────────────────────────────────────────
api_max_retries: 5
api_retry_base_delay: 2.0  # seconds, exponential backoff
api_requests_per_minute: 30

# ── Paths ─────────────────────────────────────────────────────
data_raw_dir: "data/raw"
data_encoded_dir: "data/encoded"
results_raw_dir: "results/raw"
results_tables_dir: "results/tables"
logs_dir: "logs"
